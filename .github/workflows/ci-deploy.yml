name: CI / Deploy

on:
  pull_request:
  push:
    branches: [main, staging]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SHOWREEL_URL: ${{ vars.VITE_SHOWREEL_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          include-hidden-files: true # keeps .htaccess
          retention-days: 7

  deploy:
    name: Deploy to HostGator (FTP)
    needs: build
    # Turn on by adding the repository variable DEPLOY_ENABLED = true
    # (Settings → Secrets and variables → Actions → Variables) once the FTP secrets exist.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Upload over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          # "strict" verifies the TLS certificate. If the FTP host name doesn't match
          # HostGator's shared certificate, set the repo variable FTP_SECURITY = loose
          # (still encrypted, just skips the host-name check).
          security: ${{ vars.FTP_SECURITY || 'strict' }}
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_SERVER_DIR || './public_html/' }}

  deploy-staging:
    name: Deploy to staging (FTP)
    needs: build
    # Pushes to the "staging" branch publish to the preview site, never to production.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/staging' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Upload over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.STAGING_FTP_USERNAME }}
          password: ${{ secrets.STAGING_FTP_PASSWORD }}
          protocol: ftps
          security: ${{ vars.FTP_SECURITY || 'strict' }}
          local-dir: ./dist/
          server-dir: ${{ secrets.STAGING_FTP_SERVER_DIR || './' }}
